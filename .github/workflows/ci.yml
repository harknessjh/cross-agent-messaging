name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check tools tests

      - name: Lint
        run: >-
          python -m ruff check
          --select E4,E7,E9,F,I,B,UP
          --target-version py311
          tools tests

      - name: Run offline tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Check command help
        run: |
          python tools/cam1.py --help
          python tools/cam1_project.py --help
          python tools/cam1_transport.py --help

  macos-acl:
    name: Darwin ACL boundary
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Exercise Darwin ACL boundary
        run: >-
          python -m unittest discover
          --start-directory tests
          --pattern test_cam1_acl.py
          --verbose

  minimum-dependencies:
    name: Minimum declared dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimum declared dependencies
        run: >-
          python -m pip install
          --requirement requirements-dev.txt
          --constraint .github/constraints/minimum.txt

      - name: Run quality gates
        run: |
          python -m ruff format --check tools tests
          python -m ruff check --select E4,E7,E9,F,I,B,UP --target-version py311 tools tests
          python -m unittest discover --start-directory tests --verbose
          python tools/cam1_project.py --help
