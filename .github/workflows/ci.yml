name: CI

# Pull requests run a focused set: the oldest and newest supported Python on
# Linux, plus the full suite on macOS. Pushes to main and manual runs add the
# middle Python versions and the minimum-declared-dependency job. Each event
# runs once: branch pushes without a pull request do not trigger CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its stale run. Pushes to main
# and manual runs each get a unique group, so every merge is tested in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.14"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check tools tests

      - name: Lint
        run: >-
          python -m ruff check
          --select E4,E7,E9,F,I,B,UP
          --target-version py311
          tools tests

      - name: Run offline tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Check command help
        run: |
          python tools/cam1.py --help
          python tools/cam1_project.py --help
          python tools/cam1_transport.py --help

  macos:
    # The full suite includes the Darwin ACL and native-executable boundary
    # tests that the Linux jobs cannot exercise.
    name: macOS full suite
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run offline tests
        run: python -m unittest discover --start-directory tests --verbose

  minimum-dependencies:
    name: Minimum declared dependencies
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimum declared dependencies
        run: >-
          python -m pip install
          --requirement requirements-dev.txt
          --constraint .github/constraints/minimum.txt

      - name: Run quality gates
        run: |
          python -m ruff format --check tools tests
          python -m ruff check --select E4,E7,E9,F,I,B,UP --target-version py311 tools tests
          python -m unittest discover --start-directory tests --verbose
          python tools/cam1_project.py --help
