name: CI

# Pull requests run a focused set: the oldest and newest supported Python on
# Linux, plus macOS. Pushes to main and manual runs add the middle Python
# versions and the minimum-declared-dependency job. Each event runs once:
# branch pushes without a pull request do not trigger CI.
#
# Every configuration runs the whole offline suite, split by test module into
# parallel shards (.github/scripts/test_shard.py). Formatting, lint and
# command-help checks run once per configuration, in its first shard.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its stale run. Pushes to main
# and manual runs each get a unique group, so every merge is tested in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.14"]') || fromJSON('["3.11", "3.12", "3.13", "3.14"]') }}
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Check formatting
        if: matrix.shard == '1/3'
        run: python -m ruff format --check tools tests .github/scripts

      - name: Lint
        if: matrix.shard == '1/3'
        run: >-
          python -m ruff check
          --select E4,E7,E9,F,I,B,UP
          --target-version py311
          tools tests .github/scripts

      - name: Run offline tests
        run: python .github/scripts/test_shard.py ${{ matrix.shard }}

      - name: Check command help
        if: matrix.shard == '1/3'
        run: |
          python tools/cam1.py --help
          python tools/cam1_project.py --help
          python tools/cam1_transport.py --help

  macos:
    # macOS also runs the Darwin ACL and native-executable boundary tests that
    # the Linux jobs cannot exercise.
    name: macOS (${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run offline tests
        run: python .github/scripts/test_shard.py ${{ matrix.shard }}

  minimum-dependencies:
    name: Minimum declared dependencies (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimum declared dependencies
        run: >-
          python -m pip install
          --requirement requirements-dev.txt
          --constraint .github/constraints/minimum.txt

      - name: Run quality gates
        if: matrix.shard == '1/2'
        run: |
          python -m ruff format --check tools tests .github/scripts
          python -m ruff check --select E4,E7,E9,F,I,B,UP --target-version py311 tools tests .github/scripts
          python tools/cam1_project.py --help

      - name: Run offline tests
        run: python .github/scripts/test_shard.py ${{ matrix.shard }}
