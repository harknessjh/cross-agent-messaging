<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title description">
  <title id="title">CAM/1 local message flow</title>
  <desc id="description">Either a Codex or Claude Code agent calls CAM's send helper. The helper finds the recipient and validates the envelope, then uses Claude Code MCP SendMessage for a Claude recipient or Codex CLI queue for a Codex recipient. The product delivers the message before the receiving agent validates it with CAM. Send and receive events are recorded in a separate shared project journal. The journal is not a mailbox and does not deliver messages or wake agents.</desc>
  <defs>
    <marker id="delivery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563a6"/>
    </marker>
    <marker id="audit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#98611e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #182c42; }
      .node { fill: #f6f8fb; stroke: #a7b6c7; stroke-width: 1.5; }
      .cam { fill: #edf5ff; stroke: #2563a6; stroke-width: 1.5; }
      .heading { font-size: 23px; font-weight: 600; text-anchor: middle; }
      .body { font-size: 18px; text-anchor: middle; }
      .label { font-size: 17px; text-anchor: middle; fill: #3f536b; }
      .delivery { fill: none; stroke: #2563a6; stroke-width: 2.5; marker-end: url(#delivery-arrow); }
      .audit { fill: none; stroke: #98611e; stroke-width: 2.5; stroke-dasharray: 5 6; marker-end: url(#audit-arrow); }
      .audit-label { font-size: 17px; text-anchor: middle; fill: #80501c; }
    </style>
  </defs>
  <rect width="1000" height="740" rx="16" fill="#ffffff"/>
  <text x="40" y="45" font-size="27" font-weight="650">CAM/1 · How a message travels</text>
  <text x="40" y="76" font-size="18" fill="#3f536b">One computer · One OS account · One CAM project</text>

  <rect class="node" x="170" y="106" width="360" height="80" rx="12"/>
  <text class="heading" x="350" y="139">Sending agent</text>
  <text class="body" x="350" y="165">Codex or Claude Code</text>
  <path class="delivery" d="M350 186 V224"/>

  <rect class="cam" x="170" y="226" width="360" height="88" rx="12"/>
  <text class="heading" x="350" y="260">CAM send helper</text>
  <text class="body" x="350" y="288">Roster lookup + envelope validation</text>

  <path class="delivery" d="M350 314 V354 H180 V393"/>
  <path class="delivery" d="M350 314 V354 H520 V393"/>
  <text class="label" x="265" y="380">To Claude Code</text>
  <text class="label" x="590" y="380">To Codex</text>

  <rect class="node" x="30" y="395" width="300" height="96" rx="12"/>
  <text class="heading" x="180" y="431">Claude Code transport</text>
  <text class="body" x="180" y="463">MCP SendMessage</text>
  <rect class="node" x="370" y="395" width="300" height="96" rx="12"/>
  <text class="heading" x="520" y="431">Codex transport</text>
  <text class="body" x="520" y="463">CLI queue</text>

  <path d="M180 491 V533 H350 M520 491 V533 H350" fill="none" stroke="#2563a6" stroke-width="2.5"/>
  <path class="delivery" d="M350 533 V567"/>
  <rect class="node" x="125" y="569" width="450" height="92" rx="12"/>
  <text class="heading" x="350" y="604">Receiving agent</text>
  <text class="body" x="350" y="635">Product delivery, then CAM validation</text>

  <path class="audit" d="M530 270 H850 V328"/>
  <text class="audit-label" x="715" y="253">Send intent + outcome</text>
  <rect x="720" y="330" width="255" height="186" rx="12" fill="#fff8ed" stroke="#b08043" stroke-width="1.5"/>
  <text class="heading" x="847" y="369">Project journal</text>
  <text class="body" x="847" y="400">Shared audit history</text>
  <path d="M748 419 H947" stroke="#d9c4a7" stroke-width="1"/>
  <text class="body" x="847" y="449" font-weight="600">Not a mailbox</text>
  <text class="body" x="847" y="480">No polling or wake-up</text>
  <path class="audit" d="M575 615 H850 V518"/>
  <text class="audit-label" x="720" y="597">Received bytes + checks</text>

  <path class="delivery" d="M175 706 H222"/>
  <text x="234" y="712" font-size="17">Delivery path</text>
  <path class="audit" d="M435 706 H482"/>
  <text x="494" y="712" font-size="17">Audit recording</text>
</svg>
